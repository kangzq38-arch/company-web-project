<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <script>
      var repo = '/company-web-project';
      var path = window.location.pathname;
      if (path.startsWith(repo)) {
        path = path.slice(repo.length) || '/';
      }
      window.location.replace(repo + '/?r=' + encodeURIComponent(path));
    </script>
  </head>
  <body></body>
</html>
